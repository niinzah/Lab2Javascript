<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nina Zahrai Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
 
</head>
  <body>
    <nav aria-label="Main navigation">
      <a href= "index.html" class="site-title">NZ</a>
      <ul>
        <li><a href= "skills.html" aria-current="page">Skills</a></li>
        <li><a href="experiences.html">Experience</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <div id="main-content">
      <header>
        <h1>Do you have feedback?</h1>
      </header>
        <p> Please fill in the form below for any feedback you may have!
          </p>
         <form id="FeedbackForm" novalidate>
            <div class="field">
                <label for="name">Full Name*</label>
                <input type="text" id="name" name="name" placeholder="Full Name" aria-required="true" aria-describedby="nameError">
                <span id="nameError"  class="error"></span>
            </div>

            <div class="field">         
                <label for="email">Email*</label>
                <input type="email" id="email" name="email" placeholder="name@gmail.com" aria-required="true" aria-describedby="emailError">
                <span id="emailError" class="error"></span>
            </div>   

            <div class="field">
                <label for="topic">Topic*</label>            
                <select id="topic" name="topic" aria-required="true" aria-describedby="topicError">
                    <option value="" disabled selected hidden>Select a Topic*</option>
                    <option value="photography">Photography</option>
                    <option value="written_content">Written Content</option>
                    <option value="other">Other</option>
                </select>
                <span id="topicError" class="error "></span>
            </div>

            <div class="field">
                <label for="comments">Comments*</label>
                <textarea id="comments" name="comments" rows="5" aria-required="true" aria-describedby="commentsError"></textarea>
                <span id="commentsCounter" class="counter">0 / 15 characters minimum</span>
                <span id="commentsError" class="error"></span>
            </div>

        <div class="field">
            <label for="website">Website (optional)</label>
            <input type="url" id="website" name="website" placeholder="https://example.com" aria-required="false" aria-describedby="websiteError">
            <span id="websiteError" class="error"></span>
        </div>
        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>
        </div>
        </form>
   
        <p>* indicates a required field</p>

      <footer>
        <p>&copy; 2026 Nina Zahrai</p>
      </footer>

    </div>
  </body>

</html>
